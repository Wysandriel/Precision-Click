<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Arena：Rift Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Reaction Arena：Rift Edition</h1>
      <p class="tagline">結合反應速度、戰術選擇與升級養成的全新挑戰</p>
    </header>

    <!-- 主選單 -->
    <section id="menu" class="screen active">
      <h2>開始你的冒險</h2>
      <p>每次遊戲包含多個階段，每完成一個階段你可以選擇一項升級，打造你的專屬流派。盡量點擊正確目標，避開陷阱，並於最後擊敗 Boss 取得高分與獎勵！</p>
      <button id="startBtn" class="primary">開始遊戲</button>
      <div class="stats-summary hidden" id="lastSummary"></div>
    </section>

    <!-- 遊戲介面 -->
    <section id="game" class="screen">
      <div class="hud">
        <div>階段：<span id="stageDisplay">1</span> / 4</div>
        <div>得分：<span id="scoreDisplay">0</span></div>
        <div>時間：<span id="timeDisplay">0</span>s</div>
        <div>生命：<span id="livesDisplay">3</span></div>
        <div>倍率：<span id="multiplierDisplay">x1.0</span></div>
      </div>
      <div id="arena" class="arena" aria-label="遊戲區域"></div>
    </section>

    <!-- 升級選擇畫面 -->
    <section id="upgrade" class="screen">
      <h2>選擇一項升級</h2>
      <div id="upgradeChoices" class="upgrade-choices"></div>
    </section>

    <!-- 結算畫面 -->
    <section id="result" class="screen">
      <h2>結算</h2>
      <p id="resultText">本局表現：</p>
      <button id="restartBtn" class="primary">再來一次</button>
      <button id="backBtn" class="secondary">回主選單</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
